[tox]
envlist = 
    py310,
    py311,
    py312,
    py313,
    py313-cov,

isolated_build = true

[testenv]
description = Run test suite
extras = test
commands =
    pytest


[testenv:py313-cov]
description = Run test suite with coverage on latest supported Python
extras = test
basepython = python3.13
commands =
    pytest -q --cov=sql2excel --cov-report=term-missing
